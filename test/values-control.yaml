# Test control plane configuration (PgDog EE)
control:
  enabled: true
  required: true
  endpoint: "wss://control.example.com/ws"
  token: "test-token-12345"
  metricsInterval: 2000
  statsInterval: 10000
  activeQueriesInterval: 5000
  requestTimeout: 2000
  configRefreshInterval: 30000
  taskUpdatesInterval: 2000

# Basic database config for testing control integration
databases:
  - name: primary
    host: postgres.example.com
    port: 5432

users:
  - name: app_user
    database: primary
    password: secret123
