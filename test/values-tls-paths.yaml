# Test explicit TLS path settings in pgdog.toml.
tlsCertificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
tlsPrivateKey: /etc/ssl/private/ssl-cert-snakeoil.key
tlsClientCaCertificate: /etc/ssl/certs/ca-certificates.crt
tlsServerCaCertificate: /etc/ssl/certs/ca-certificates.crt
tlsServerCertificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
tlsServerPrivateKey: /etc/ssl/private/ssl-cert-snakeoil.key

users:
  - name: app
    database: primary
    identity: app

databases:
  - name: primary
    host: postgres.example.com
    port: 5432
    tlsServerCertificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
    tlsServerPrivateKey: /etc/ssl/private/ssl-cert-snakeoil.key
