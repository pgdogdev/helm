# Test multiple passwords and databases per user
databases:
  - name: primary
    host: postgres-primary.example.com
    port: 5432
  - name: secondary
    host: postgres-secondary.example.com
    port: 5432

users:
  - name: app_user
    databases:
      - primary
      - secondary
    passwords:
      - "one"
      - "two"
  - name: admin_user
    database: primary
    password: single_password
