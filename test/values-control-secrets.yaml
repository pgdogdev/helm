# Test Secret references for control plane environment variables (PgDog EE).
control:
  enabled: true
  # Inline values keep configcheck independent of Kubernetes Secrets and test
  # precedence when both inline settings and Secret references are configured.
  endpoint: "https://control.example.com"
  token: "test-token"
  endpointSecret:
    name: pgdog-control-endpoint
    # Uses the default key: endpoint.
  tokenSecret:
    name: pgdog-control-token
    key: auth-token
